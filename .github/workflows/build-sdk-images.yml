name: Build Qt 5 SDK images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - containers/qt5-sdk/Dockerfile
      - config/qt5-sdks.tsv
      - scripts/build-qt5-plugin.sh
      - scripts/test-qt5-plugin.sh
      - scripts/qt-plugin-minor.sh

permissions:
  contents: read
  packages: write

concurrency:
  group: qt5-sdk-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - minor: "5.11"
            version: "5.11.3"
            sha256: c6bf887732b83ce072eb72eddb7497bedcdf9ca794e7ed91261a93f063623e1c
            url: https://download.qt.io/archive/qt/5.11/5.11.3/submodules/qtbase-everywhere-src-5.11.3.tar.xz
          - minor: "5.12"
            version: "5.12.12"
            sha256: 7c15c31590b6ec12408242b1a32075d1d545f35e1d41fdbad31ec670d00680f2
            url: https://download.qt.io/archive/qt/5.12/5.12.12/submodules/qtbase-everywhere-src-5.12.12.tar.xz
          - minor: "5.13"
            version: "5.13.2"
            sha256: 26b6b686d66a7ad28eaca349e55e2894e5a735f3831e45f2049e93b1daa92121
            url: https://download.qt.io/archive/qt/5.13/5.13.2/submodules/qtbase-everywhere-src-5.13.2.tar.xz
          - minor: "5.14"
            version: "5.14.2"
            sha256: 48b9e79220941665a9dd827548c6428f7aa3052ccba8f4f7e039a94aa1d2b28a
            url: https://download.qt.io/archive/qt/5.14/5.14.2/submodules/qtbase-everywhere-src-5.14.2.tar.xz
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/qt5-sdk/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nimf-overlay/qt5-sdk:${{ matrix.minor }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            QT_MINOR=${{ matrix.minor }}
            QT_VERSION=${{ matrix.version }}
            QT_SHA256=${{ matrix.sha256 }}
            QT_URL=${{ matrix.url }}
          cache-from: type=gha,scope=qt-${{ matrix.minor }}
          cache-to: type=gha,mode=max,scope=qt-${{ matrix.minor }}
